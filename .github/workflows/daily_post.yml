name: Daily Instagram Post

on:
  schedule:
    - cron: "0 16 * * *"   # 9:00 PM PKT (UTC+5) — post 1
    - cron: "15 16 * * *"  # 9:15 PM PKT (UTC+5) — post 2
  workflow_dispatch: {}    # lets you trigger a post manually from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render today's quiz card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: queue
        run: python main.py --render-only

      - name: Commit rendered card (must be public before publishing)
        run: |
          git config user.name "swiftie13daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Daily post $(date -u +%F-%H%M)" || echo "nothing to commit"
          git pull origin main --rebase
          git push

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: graph.instagram.com
          REPO_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python main.py --publish-only
