name: Daily Instagram Reel

on:
  workflow_dispatch: {}    # triggered by cron-job.org (external scheduler)

# Separate concurrency group from the quiz-card workflow so the two can run
# independently, but two reel triggers on the same day still queue instead
# of double-posting.
concurrency:
  group: instagram-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest queue before posting
        run: git pull origin main --rebase

      - name: Publish reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: graph.instagram.com
          REPO_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python main_reel.py

      - name: Commit updated reel queue/history
        run: |
          git config user.name "swiftie13daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Daily reel $(date -u +%F-%H%M)" || echo "nothing to commit"
          git pull origin main --rebase
          git push
